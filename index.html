<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Es-tu Démocrite ou Héraclite ?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Écran d'accueil -->
  <div class="card" id="intro-screen">
    <h1>Es-tu Démocrite ou Héraclite ?</h1>
    <p class="intro-text">
      Deux philosophes de la Grèce antique, deux façons de voir la vie :
      <strong>Démocrite</strong>, le philosophe qui rit, et
      <strong>Héraclite</strong>, le philosophe qui pleure.
    </p>
    <p class="intro-text">Réponds à 9 questions pour découvrir lequel te ressemble le plus.</p>
    <button class="main-btn" id="start">Commencer</button>
  </div>

  <!-- Écran des questions -->
  <div class="card hidden" id="quiz-screen">
    <p id="progress"></p>
    <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
    <h2 id="question"></h2>
    <div id="answers"></div>
  </div>

  <!-- Écran du résultat -->
  <div class="card hidden" id="result-screen">
    <p class="result-label">Ton résultat</p>
    <h1 id="result-title"></h1>
    <p id="result-emoji" class="result-emoji"></p>
    <p id="result-text"></p>
    <p id="result-score" class="result-score"></p>
    <button class="main-btn" id="restart">Refaire le test</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
